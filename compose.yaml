services:
  backend:
    build: ./backend
    command: ["sh", "-c", "python manage.py migrate --noinput && exec python manage.py runserver 0.0.0.0:8000"]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      BACKEND_URL: http://backend:8000
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend
